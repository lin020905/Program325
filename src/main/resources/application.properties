#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:mappers/*xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=org.xidian.program325.mybatis.entity
# 应用服务 WEB 访问端口
server.port=8080

# 数据库连接配置；在 IDEA 运行配置或环境变量中设置 DB_PASSWORD。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/meeting_room_reservation?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 表由 db/schema.sql 手动初始化，应用每次启动不重复建表。
spring.sql.init.mode=never
