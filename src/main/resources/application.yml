spring:
  datasource:
    url:  jdbc:mysql://localhost:3306/Program325?useSSL=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true

# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true # 下划线转驼峰
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: strict

debug: false
